name: Bug report
description: Something in the example is wrong, misleading, or doesn't work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Worth knowing before you file: CI only checks that the code parses,
        formats, and imports. Nothing here runs the script, so runtime reports
        are the most useful kind.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Redact your API key before pasting.
      render: text

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.4"

  - type: input
    id: anthropic-version
    attributes:
      label: anthropic version
      placeholder: "1.2.0"
