name: Release

# Fires on a pushed tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
#
# Note CI does not re-run for tags -- it triggers on pushes to main and on pull
# requests. The tagged commit was already tested when it landed on main, so this
# publishes rather than verifies. Tag a commit that is on main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes are generated by diffing against the previous tag, so
          # the full history has to be present. The default shallow clone would
          # produce empty notes.
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # --verify-tag refuses to invent a tag that is not actually pushed.
          # --generate-notes builds the changelog from commits since the last
          # release. Nothing is attached as a build artifact: this repo is a
          # single script, not a package, so the source archives GitHub creates
          # automatically are the whole release.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
