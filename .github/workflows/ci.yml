name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The pin lives in requirements-dev.txt, so contributors and CI install
      # an identical ruff and Dependabot can actually see the version.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  # Verifies the README's "Python 3.10+" claim, that requirements.txt still
  # resolves, and that merge_blocks behaves on every supported version.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-dev.txt

      # The tests import quickstart, which runs the module body but not
      # main() -- that is guarded by __name__ == "__main__". So they need no
      # credentials and make no API call; CI still never spends money.
      # Actually running quickstart.py is deliberately not a CI step.
      # --cov with no argument uses [tool.coverage.run] source from
      # pyproject.toml, which also sets fail_under = 100.
      - run: pytest -q --cov
