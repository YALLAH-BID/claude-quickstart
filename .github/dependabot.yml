version: 2

updates:
  # Workflow action versions (actions/checkout, actions/setup-python).
  # This is where Dependabot earns its keep here -- major action bumps are
  # otherwise invisible until a runner deprecation breaks the build.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  # requirements.txt and requirements-dev.txt. Mixed behaviour worth knowing:
  # anthropic is a range (>=1.2.0,<2), so every 1.x release already satisfies it
  # and nothing is raised until 2.0 -- the one bump worth a human deciding on.
  # ruff is an exact pin, so it will get real update PRs, which is the point of
  # moving it out of the workflow.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
