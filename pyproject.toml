# Tool configuration only. This is a single-file example, not a package, so
# there is deliberately no [project] table -- dependencies live in
# requirements.txt and requirements-dev.txt, which is what CI and Dependabot
# read.

[tool.ruff]
# Both stated explicitly rather than inherited: a future ruff release changing
# a default would otherwise reformat the file or shift which rules apply.
line-length = 88
target-version = "py310"  # the floor claimed in the README and tested in CI

[tool.ruff.lint]
# Beyond ruff's default (E4/E7/E9 + F): import sorting, modern-syntax upgrades,
# and bugbear's correctness lints.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The report generator embeds long Excel formula strings that cannot be split
# without corrupting the formulas; every other rule still applies to it.
"stock_report/pipeline.py" = ["E501"]

[tool.pytest.ini_options]
# The example is a top-level script, not a package, so tests/ needs the repo
# root on sys.path to `import quickstart`.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["quickstart"]

[tool.coverage.report]
# The entry-point guard cannot run under test -- executing it means running the
# program. Excluding it is what makes 100% an honest target rather than a line
# nobody can ever reach.
exclude_also = ['if __name__ == "__main__":']
# Enforced in CI, so the README badge cannot silently overstate coverage: if it
# drops below this, the build fails before anyone sees a stale number.
fail_under = 100
